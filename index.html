<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AM Coffee | Launch Offer Proposal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0e11; color: #fff; }
    .gold-button { background: linear-gradient(135deg, #e3c47e 0%, #c49a45 100%); color: #000; }
    .gold-text { color: #e3c47e; }
    .card-dark { background-color: #121418; border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="p-4 sm:p-8 max-w-xl mx-auto space-y-6">

  <!-- OFFER PRICING CARD -->
  <div class="bg-black border border-amber-500/30 rounded-2xl p-6 text-center space-y-4 shadow-2xl">
    <h2 class="text-xl font-bold gold-text tracking-wide">AM Coffee Launch Package</h2>
    
    <div class="flex items-center justify-center gap-3">
      <span class="line-through text-gray-500 text-sm">Normally 25k</span>
      <span class="text-2xl font-extrabold text-white">12k one-time</span>
    </div>

    <p class="text-xs text-gray-400 leading-relaxed font-light">
      Guarantee: If di kayo magka-20 extra Viber/SMS inquiries in 7 days, delete ko at refund.
    </p>

    <button class="w-full py-3.5 rounded-xl gold-button font-bold text-xs uppercase tracking-wider hover:opacity-90 transition">
      Yes, Make It Live Tomorrow 3PM
    </button>
  </div>

  <!-- APPROVAL & FORM CARD -->
  <div class="card-dark rounded-2xl p-6 space-y-4">
    <h3 class="text-sm font-bold text-gray-200">Approve & Make It Live</h3>
    
    <form class="space-y-3">
      <div>
        <input type="text" placeholder="Your Name (Owner/Manager)" class="w-full bg-[#181a20] border border-gray-800 rounded-xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-500/50">
      </div>
      <div>
        <input type="text" placeholder="Viber / Mobile Number" class="w-full bg-[#181a20] border border-gray-800 rounded-xl p-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-500/50">
      </div>

      <button type="button" class="w-full py-3.5 rounded-xl bg-black border border-gray-700 text-white font-bold text-xs tracking-wide hover:bg-gray-900 transition">
        Approve - Build My Version Tonight
      </button>
    </form>
  </div>

  <!-- FOOTER EXPIRATION NOTE -->
  <p class="text-[10px] text-gray-500 text-center tracking-tight">
    Private link made for AM Coffee • Along Sta. Rosa - Tagaytay Rd • Expires in 48h
  </p>

</body>
</html>
